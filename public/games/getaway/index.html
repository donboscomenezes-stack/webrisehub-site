<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b10">
    <title>GETAWAY</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main id="gameShell" class="game-shell">
      <canvas id="gameCanvas" aria-label="GETAWAY arcade driving game"></canvas>

      <section id="hud" class="hud" aria-live="polite">
        <div class="hud-left">
          <div class="score-label">SCORE</div>
          <div id="score" class="score">0</div>
        </div>
        <div class="hud-center">
          <div id="wanted" class="wanted" aria-label="Wanted level">-----</div>
          <div id="eventBanner" class="event-banner"></div>
        </div>
        <div class="hud-right">
          <div class="condition" aria-label="Car condition">
            <span id="conditionA"></span>
            <span id="conditionB"></span>
            <span id="conditionC"></span>
          </div>
          <div class="nitro-wrap">
            <span>NITRO</span>
            <div class="nitro-meter"><i id="nitroFill"></i></div>
          </div>
          <button id="soundToggle" class="icon-button" type="button" aria-label="Toggle sound">SND</button>
        </div>
      </section>

      <button id="nitroButton" class="nitro-button" type="button">NITRO</button>

      <section id="menu" class="screen menu-screen">
        <div class="title-lockup">
          <p class="eyebrow">Night chase arcade</p>
          <h1>GETAWAY</h1>
          <p class="tagline">How long can you escape?</p>
        </div>
        <button id="startButton" class="primary-button" type="button">START</button>
        <div class="controls">
          <span>Left / Right steer</span>
          <span>Space nitro</span>
        </div>
      </section>

      <section id="pauseScreen" class="screen hidden">
        <h2>PAUSED</h2>
        <p>Press Space or tap to resume.</p>
      </section>

      <section id="gameOver" class="screen game-over hidden">
        <p id="bestBadge" class="best-badge"></p>
        <h2>BUSTED</h2>
        <div id="finalScore" class="final-score">0</div>
        <div id="stats" class="stats"></div>
        <button id="restartButton" class="primary-button" type="button">PLAY AGAIN</button>
        <p class="restart-hint">Press Space to restart</p>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
