<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LOCK IN</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #08090b;
      --panel: rgba(255, 255, 255, 0.055);
      --panel-strong: rgba(255, 255, 255, 0.105);
      --line: rgba(255, 255, 255, 0.14);
      --line-soft: rgba(255, 255, 255, 0.08);
      --text: #f4f4f1;
      --muted: rgba(244, 244, 241, 0.58);
      --faint: rgba(244, 244, 241, 0.32);
      --accent: #d8ff6a;
      --accent-2: #91e7ff;
      --danger: #ff776f;
      --perfect: #fff2a7;
      --good: #a9f5d0;
      --close: #9cc7ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      user-select: none;
      touch-action: none;
    }

    button {
      font: inherit;
    }

    .shell {
      width: min(100vw, 1180px);
      height: min(100svh, 880px);
      min-height: 620px;
      padding: clamp(18px, 3.3vw, 42px);
      display: grid;
      grid-template-rows: auto 1fr;
      position: relative;
      isolation: isolate;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: -28%;
      background:
        radial-gradient(circle at 50% 42%, rgba(216, 255, 106, 0.075), transparent 29%),
        radial-gradient(circle at 74% 18%, rgba(145, 231, 255, 0.055), transparent 23%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.022), transparent 44%);
      pointer-events: none;
      z-index: -2;
    }

    .shell::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.014) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: radial-gradient(circle at 50% 42%, black, transparent 72%);
      pointer-events: none;
      z-index: -1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .best {
      display: flex;
      align-items: baseline;
      gap: 9px;
      min-width: 120px;
    }

    .best strong,
    .sound-toggle {
      color: var(--text);
      letter-spacing: 0;
      font-weight: 650;
    }

    .sound-toggle {
      min-width: 94px;
      height: 36px;
      border: 1px solid var(--line-soft);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .sound-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--line);
      background: var(--panel-strong);
    }

    .sound-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--faint);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.035);
    }

    .sound-toggle[data-on="true"] .sound-dot {
      background: var(--accent);
      box-shadow: 0 0 14px rgba(216, 255, 106, 0.58);
    }

    .stage {
      min-height: 0;
      display: grid;
      place-items: center;
      position: relative;
    }

    .game-stack {
      width: min(78vmin, 620px);
      max-width: calc(100vw - 36px);
      display: grid;
      grid-template-rows: auto auto auto;
      justify-items: center;
      align-content: center;
      gap: clamp(14px, 2.4vmin, 22px);
      transform: scale(var(--arena-scale, 1));
      transition: transform 120ms cubic-bezier(.2,.9,.2,1);
    }

    .score-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-align: center;
    }

    .score {
      min-height: 72px;
      font-size: clamp(48px, 10vmin, 92px);
      line-height: 0.95;
      font-weight: 760;
      letter-spacing: 0;
      font-variant-numeric: tabular-nums;
      text-align: center;
      transition: transform 160ms ease;
    }

    .score.bump {
      transform: translateY(-1px) scale(1.035);
    }

    .arena-wrap {
      width: min(64vmin, 490px);
      max-width: calc(100vw - 40px);
      aspect-ratio: 1;
      position: relative;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      touch-action: none;
    }

    .result-pop {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) translateY(-24px) scale(0.96);
      opacity: 0;
      pointer-events: none;
      text-align: center;
      filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.48));
    }

    .result-pop.show {
      animation: resultPop 680ms cubic-bezier(.18,.95,.24,1) forwards;
    }

    .result-pop .word {
      font-size: clamp(28px, 6vmin, 54px);
      line-height: 1;
      font-weight: 820;
      letter-spacing: 0.02em;
    }

    .result-pop .points {
      margin-top: 6px;
      color: var(--muted);
      font-size: clamp(16px, 2.8vmin, 24px);
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    @keyframes resultPop {
      0% { opacity: 0; transform: translate(-50%, -50%) translateY(2px) scale(0.88); }
      14% { opacity: 1; transform: translate(-50%, -50%) translateY(-30px) scale(1.03); }
      70% { opacity: 1; transform: translate(-50%, -50%) translateY(-50px) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) translateY(-66px) scale(0.96); }
    }

    .special-banner {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.96);
      min-width: 190px;
      padding: 15px 20px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      background: rgba(8, 9, 11, 0.72);
      backdrop-filter: blur(18px);
      color: var(--text);
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
    }

    .special-banner.show {
      animation: specialFlash 660ms ease forwards;
    }

    @keyframes specialFlash {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.95); }
      18%, 78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.02); }
    }

    .below {
      min-height: 78px;
      display: grid;
      justify-items: center;
      gap: 12px;
    }

    .combo {
      height: 26px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 760;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(3px);
      transition: opacity 160ms ease, transform 160ms ease, color 160ms ease;
    }

    .combo.active {
      opacity: 1;
      transform: translateY(0);
      color: var(--accent);
    }

    .lives {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 18px;
    }

    .life {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--text);
      opacity: 0.9;
      box-shadow: 0 0 0 5px rgba(255,255,255,0.035);
      transition: opacity 220ms ease, transform 220ms ease, background 220ms ease;
    }

    .life.lost {
      opacity: 0.18;
      transform: scale(0.72);
      background: var(--muted);
      box-shadow: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(circle at center, rgba(8,9,11,0.42), rgba(8,9,11,0.78) 68%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
      z-index: 5;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    #gameOverOverlay {
      background: radial-gradient(circle at center, rgba(8,9,11,0.68), rgba(8,9,11,0.9) 72%);
    }

    .menu,
    .game-over {
      width: min(420px, calc(100vw - 36px));
      display: grid;
      justify-items: center;
      text-align: center;
      transform: translateY(7px);
      transition: transform 260ms ease;
    }

    .overlay.show .menu,
    .overlay.show .game-over {
      transform: translateY(0);
    }

    h1 {
      margin: 0;
      font-size: clamp(46px, 11vw, 86px);
      line-height: 0.9;
      letter-spacing: 0;
      font-weight: 840;
    }

    .tagline,
    .restart-copy {
      margin: 17px 0 24px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.45;
    }

    .restart-copy {
      margin: 14px 0 0;
      font-size: 14px;
    }

    .primary {
      min-width: 178px;
      height: 54px;
      border: 1px solid rgba(216, 255, 106, 0.44);
      border-radius: 999px;
      background: var(--accent);
      color: #111407;
      font-weight: 820;
      letter-spacing: 0.08em;
      cursor: pointer;
      box-shadow: 0 18px 46px rgba(216, 255, 106, 0.15);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 24px 54px rgba(216, 255, 106, 0.21);
    }

    .primary:active {
      transform: translateY(0) scale(0.99);
    }

    .secondary {
      min-width: 178px;
      height: 46px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-weight: 760;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .secondary:hover {
      transform: translateY(-1px);
      border-color: rgba(216, 255, 106, 0.34);
      background: rgba(255, 255, 255, 0.105);
    }

    .secondary:disabled {
      cursor: default;
      opacity: 0.56;
      transform: none;
    }

    .actions {
      display: grid;
      justify-items: center;
      gap: 10px;
    }

    .share-status {
      min-height: 18px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .hint {
      margin-top: 18px;
      color: var(--faint);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .game-over h2 {
      margin: 0 0 14px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 800;
    }

    .final-score {
      margin-bottom: 14px;
      font-size: clamp(52px, 10vw, 86px);
      line-height: 0.9;
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }

    .stats {
      width: 100%;
      margin-bottom: 22px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      min-height: 68px;
      padding: 13px 14px;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      background: var(--panel);
      text-align: left;
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 760;
    }

    .stat strong {
      display: block;
      margin-top: 7px;
      color: var(--text);
      font-size: 22px;
      font-weight: 780;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 720px) {
      .shell {
        width: 100vw;
        height: 100svh;
        min-height: 0;
        padding: 18px 18px max(18px, env(safe-area-inset-bottom));
      }

      .topbar {
        font-size: 11px;
      }

      .best {
        min-width: 0;
      }

      .sound-toggle {
        min-width: 82px;
        height: 34px;
      }

      .game-stack {
        width: 100%;
        gap: 11px;
      }

      .arena-wrap {
        width: min(86vw, 440px);
      }

      .score {
        min-height: 56px;
      }

      .below {
        min-height: 64px;
      }

    }

    @media (max-height: 650px) and (orientation: landscape) {
      .shell {
        min-height: 0;
        padding-block: 14px;
      }

      .game-stack {
        width: min(52vw, 460px);
        gap: 8px;
      }

      .arena-wrap {
        width: min(48vh, 380px);
      }

      .score {
        min-height: 45px;
        font-size: 42px;
      }

      .below {
        min-height: 48px;
      }
    }
  </style>
</head>
<body>
  <main class="shell" id="app" aria-label="LOCK IN timing game">
    <header class="topbar">
      <div class="best">Best <strong id="bestScore">0</strong></div>
      <button class="sound-toggle" id="soundToggle" type="button" data-on="false" aria-pressed="false" aria-label="Toggle sound">
        <span class="sound-dot" aria-hidden="true"></span>
        <span id="soundText">Sound</span>
      </button>
    </header>

    <section class="stage" id="stage">
      <div class="game-stack" id="gameStack">
        <div>
          <div class="score-label">Score</div>
          <div class="score" id="score">0</div>
        </div>

        <div class="arena-wrap" id="arenaWrap">
          <canvas id="game" width="980" height="980" aria-label="Circular timing arena"></canvas>
          <div class="result-pop" id="resultPop" aria-live="polite">
            <div class="word" id="resultWord">PERFECT</div>
            <div class="points" id="resultPoints">+100</div>
          </div>
          <div class="special-banner" id="specialBanner">REVERSE</div>
        </div>

        <div class="below">
          <div class="combo" id="combo">Combo x1</div>
          <div class="lives" id="lives" aria-label="Lives">
            <span class="life"></span>
            <span class="life"></span>
            <span class="life"></span>
          </div>
        </div>
      </div>

      <div class="overlay show" id="startOverlay">
        <div class="menu">
          <h1>LOCK IN</h1>
          <p class="tagline">Hit the target at the perfect moment.</p>
          <button class="primary" id="startButton" type="button">START</button>
          <div class="hint">Press Space to play</div>
        </div>
      </div>

      <div class="overlay" id="gameOverOverlay">
        <div class="game-over">
          <h2>Run Complete</h2>
          <div class="final-score" id="finalScore">0</div>
          <div class="stats">
            <div class="stat"><span>Best</span><strong id="finalBest">0</strong></div>
            <div class="stat"><span>Best Combo</span><strong id="finalCombo">0</strong></div>
            <div class="stat"><span>Accuracy</span><strong id="finalAccuracy">0%</strong></div>
            <div class="stat"><span>Perfect Hits</span><strong id="finalPerfects">0</strong></div>
          </div>
          <div class="actions">
            <button class="secondary" id="shareButton" type="button">SHARE RESULT</button>
            <button class="primary" id="againButton" type="button">PLAY AGAIN</button>
            <div class="share-status" id="shareStatus" aria-live="polite"></div>
          </div>
          <div class="restart-copy">Press Space to restart</div>
        </div>
      </div>
    </section>

  </main>

  <script>
    (() => {
      "use strict";

      const TAU = Math.PI * 2;
      const STORAGE = {
        bestScore: "lock-in-best-score",
        bestCombo: "lock-in-best-combo",
        sound: "lock-in-sound"
      };

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const app = document.getElementById("app");
      const gameStack = document.getElementById("gameStack");
      const scoreEl = document.getElementById("score");
      const bestScoreEl = document.getElementById("bestScore");
      const comboEl = document.getElementById("combo");
      const livesEl = document.getElementById("lives");
      const startOverlay = document.getElementById("startOverlay");
      const gameOverOverlay = document.getElementById("gameOverOverlay");
      const startButton = document.getElementById("startButton");
      const againButton = document.getElementById("againButton");
      const shareButton = document.getElementById("shareButton");
      const shareStatus = document.getElementById("shareStatus");
      const soundToggle = document.getElementById("soundToggle");
      const soundText = document.getElementById("soundText");
      const resultPop = document.getElementById("resultPop");
      const resultWord = document.getElementById("resultWord");
      const resultPoints = document.getElementById("resultPoints");
      const specialBanner = document.getElementById("specialBanner");
      const finalScore = document.getElementById("finalScore");
      const finalBest = document.getElementById("finalBest");
      const finalCombo = document.getElementById("finalCombo");
      const finalAccuracy = document.getElementById("finalAccuracy");
      const finalPerfects = document.getElementById("finalPerfects");

      const palette = {
        text: "#f4f4f1",
        muted: "rgba(244,244,241,0.46)",
        line: "rgba(255,255,255,0.13)",
        faint: "rgba(255,255,255,0.065)",
        accent: "#d8ff6a",
        accentSoft: "rgba(216,255,106,0.23)",
        perfect: "#fff2a7",
        good: "#a9f5d0",
        close: "#9cc7ff",
        miss: "#ff776f",
        blue: "#91e7ff"
      };

      const state = {
        status: "menu",
        score: 0,
        lives: 3,
        combo: 0,
        bestComboRun: 0,
        perfectHits: 0,
        attempts: 0,
        hits: 0,
        successfulHits: 0,
        angle: -Math.PI / 2,
        direction: 1,
        speed: 1.55,
        targetAngle: Math.PI * 0.35,
        targetSize: 0.62,
        round: 0,
        special: null,
        specialUntil: 0,
        freezeUntil: 0,
        lastTime: 0,
        pulse: 0,
        arenaKick: 0,
        bestScore: readNumber(STORAGE.bestScore),
        savedBestCombo: readNumber(STORAGE.bestCombo),
        soundOn: localStorage.getItem(STORAGE.sound) === "true",
        lastTargetAngle: Math.PI * 0.35,
        particles: [],
        ripples: [],
        floaters: [],
        nextMilestone: 5,
        audio: null,
        newBestPlayed: false
      };

      function readNumber(key) {
        const value = Number(localStorage.getItem(key));
        return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function wrapAngle(angle) {
        angle %= TAU;
        return angle < 0 ? angle + TAU : angle;
      }

      function angleDistance(a, b) {
        return Math.abs(Math.atan2(Math.sin(a - b), Math.cos(a - b)));
      }

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function mix(a, b, t) {
        return a + (b - a) * t;
      }

      function formatPercent(hits, attempts) {
        return attempts ? `${Math.round((hits / attempts) * 100)}%` : "0%";
      }

      function setSoundUI() {
        soundToggle.dataset.on = String(state.soundOn);
        soundToggle.setAttribute("aria-pressed", String(state.soundOn));
        soundText.textContent = state.soundOn ? "On" : "Sound";
      }

      function ensureAudio() {
        if (!state.audio) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return null;
          state.audio = new AudioContext();
        }
        if (state.audio.state === "suspended") state.audio.resume();
        return state.audio;
      }

      function tone(kind) {
        if (!state.soundOn) return;
        const audio = ensureAudio();
        if (!audio) return;

        const now = audio.currentTime;
        const out = audio.createGain();
        out.connect(audio.destination);
        out.gain.setValueAtTime(0.0001, now);

        const osc = audio.createOscillator();
        const filter = audio.createBiquadFilter();
        osc.connect(filter);
        filter.connect(out);
        filter.type = "lowpass";
        filter.frequency.value = 2400;

        const notes = {
          perfect: [660, 990, 1320, 0.18, 0.055],
          good: [470, 705, 940, 0.13, 0.04],
          close: [310, 390, 0, 0.1, 0.035],
          miss: [180, 124, 0, 0.18, 0.045],
          gameover: [150, 98, 72, 0.38, 0.05],
          best: [760, 1140, 1520, 0.24, 0.05]
        }[kind];

        osc.type = kind === "miss" || kind === "gameover" ? "triangle" : "sine";
        osc.frequency.setValueAtTime(notes[0], now);
        if (notes[1]) osc.frequency.exponentialRampToValueAtTime(notes[1], now + notes[3] * 0.48);
        if (notes[2]) osc.frequency.exponentialRampToValueAtTime(notes[2], now + notes[3]);
        out.gain.exponentialRampToValueAtTime(notes[4], now + 0.012);
        out.gain.exponentialRampToValueAtTime(0.0001, now + notes[3]);
        osc.start(now);
        osc.stop(now + notes[3] + 0.02);
      }

      function updateHud() {
        scoreEl.textContent = state.score;
        bestScoreEl.textContent = Math.max(state.bestScore, state.score);
        comboEl.textContent = `Combo x${Math.max(1, state.combo)}`;
        comboEl.classList.toggle("active", state.combo > 1);
        Array.from(livesEl.children).forEach((dot, index) => {
          dot.classList.toggle("lost", index >= state.lives);
        });
      }

      function resetRun() {
        state.status = "playing";
        state.score = 0;
        state.lives = 3;
        state.combo = 0;
        state.bestComboRun = 0;
        state.perfectHits = 0;
        state.attempts = 0;
        state.hits = 0;
        state.successfulHits = 0;
        state.angle = -Math.PI / 2;
        state.direction = Math.random() > 0.5 ? 1 : -1;
        state.speed = 1.55;
        state.targetSize = 0.64;
        state.round = 0;
        state.special = null;
        state.specialUntil = 0;
        state.freezeUntil = 0;
        state.pulse = 0;
        state.arenaKick = 0;
        state.particles.length = 0;
        state.ripples.length = 0;
        state.floaters.length = 0;
        state.nextMilestone = 5;
        state.newBestPlayed = false;
        chooseTarget(true);
        shareStatus.textContent = "";
        startOverlay.classList.remove("show");
        gameOverOverlay.classList.remove("show");
        updateHud();
      }

      function chooseTarget(initial = false) {
        let next = rand(0, TAU);
        let tries = 0;
        while (!initial && angleDistance(next, state.lastTargetAngle) < 0.82 && tries < 16) {
          next = rand(0, TAU);
          tries += 1;
        }
        state.targetAngle = next;
        state.lastTargetAngle = next;
      }

      function maybeStartSpecial() {
        const unlocked = [];
        if (state.successfulHits >= 5) unlocked.push("reverse", "speed");
        if (state.successfulHits >= 9) unlocked.push("tiny");
        if (state.successfulHits >= 13) unlocked.push("moving");
        if (state.successfulHits >= 17) unlocked.push("double");

        const eligibleRound = state.successfulHits > 0 && state.successfulHits % 5 === 0;
        if (!eligibleRound || !unlocked.length || Math.random() > 0.72) {
          state.special = null;
          return;
        }

        state.special = unlocked[Math.floor(Math.random() * unlocked.length)];
        state.specialUntil = performance.now() + 6500;

        if (state.special === "reverse") state.direction *= -1;

        const labels = {
          reverse: "REVERSE",
          speed: "SPEED",
          tiny: "TINY TARGET",
          moving: "MOVING TARGET",
          double: "DOUBLE"
        };
        showSpecial(labels[state.special]);
      }

      function advanceDifficulty() {
        state.successfulHits += 1;
        state.round += 1;
        const wobble = rand(-0.015, 0.026);
        state.speed = clamp(state.speed + 0.055 + wobble, 1.55, 4.45);
        state.targetSize = clamp(state.targetSize - rand(0.008, 0.018), 0.255, 0.64);
        maybeStartSpecial();
        chooseTarget();
      }

      function targetSize() {
        let size = state.targetSize;
        if (state.special === "tiny") size *= 0.62;
        if (state.status === "menu") size = 0.7;
        return clamp(size, 0.17, 0.78);
      }

      function activeTargets() {
        const size = targetSize();
        if (state.special === "double") {
          return [
            { angle: state.targetAngle, size },
            { angle: wrapAngle(state.targetAngle + Math.PI + 0.45), size: size * 0.92 }
          ];
        }
        return [{ angle: state.targetAngle, size }];
      }

      function evaluateHit(angle = state.angle) {
        const targets = activeTargets();
        let best = { distance: Infinity, target: targets[0] };
        for (const target of targets) {
          const distance = angleDistance(angle, target.angle);
          if (distance < best.distance) best = { distance, target };
        }

        const half = best.target.size / 2;
        const ratio = half > 0 ? best.distance / half : Infinity;
        if (ratio <= 0.18) return { name: "PERFECT", base: 100, kind: "perfect", distance: best.distance, ratio };
        if (ratio <= 0.52) return { name: "GOOD", base: 50, kind: "good", distance: best.distance, ratio };
        if (ratio <= 1) return { name: "CLOSE", base: 20, kind: "close", distance: best.distance, ratio };
        if (ratio <= 1.13) return { name: "SO CLOSE", base: 0, kind: "miss-close", distance: best.distance, ratio };
        return { name: "MISS", base: 0, kind: "miss", distance: best.distance, ratio };
      }

      function playerAction(source = "tap") {
        if (source === "keyboard" && (state.status === "menu" || state.status === "over")) {
          resetRun();
          return;
        }
        if (state.status !== "playing") return;
        if (performance.now() < state.freezeUntil) return;

        state.attempts += 1;
        const result = evaluateHit();
        const success = result.base > 0;

        if (success) {
          state.hits += 1;
          state.combo += 1;
          state.bestComboRun = Math.max(state.bestComboRun, state.combo);
          const multiplier = 1 + Math.min(3, Math.floor((state.combo - 1) / 3)) * 0.25;
          const earned = Math.round(result.base * multiplier);
          state.score += earned;

          if (result.kind === "perfect") {
            state.perfectHits += 1;
            state.freezeUntil = performance.now() + 105;
            state.pulse = 1;
            state.arenaKick = 1;
            spawnParticles(result.kind, 20);
            addRipple(palette.perfect, 1.15);
            tone("perfect");
          } else {
            state.pulse = Math.max(state.pulse, result.kind === "good" ? 0.55 : 0.32);
            state.arenaKick = Math.max(state.arenaKick, result.kind === "good" ? 0.45 : 0.25);
            spawnParticles(result.kind, result.kind === "good" ? 10 : 6);
            tone(result.kind);
          }

          if (state.combo === state.nextMilestone) {
            showSpecial(`COMBO x${state.combo}`);
            addRipple(palette.accent, 1.35);
            spawnParticles("milestone", 28);
            state.nextMilestone = state.nextMilestone === 5 ? 10 : state.nextMilestone === 10 ? 20 : state.nextMilestone + 10;
          }

          if (state.score > state.bestScore && !state.newBestPlayed) {
            state.newBestPlayed = true;
            showSpecial("NEW BEST");
            tone("best");
          }

          showResult(result.name, `+${earned}`, result.kind);
          bumpScore();
          advanceDifficulty();
        } else {
          state.lives -= 1;
          state.combo = 0;
          state.pulse = 0.28;
          state.arenaKick = 0.2;
          addRipple(palette.miss, 0.8);
          showResult(result.name, "", result.kind);
          tone("miss");
          chooseTarget();
          state.direction = Math.random() > 0.93 ? state.direction * -1 : state.direction;
          if (state.lives <= 0) endRun();
        }

        updateHud();
      }

      function showResult(word, points, kind) {
        resultWord.textContent = word;
        resultPoints.textContent = points;
        resultPoints.style.display = points ? "block" : "none";
        const color = {
          perfect: palette.perfect,
          good: palette.good,
          close: palette.close,
          "miss-close": palette.close,
          miss: palette.miss
        }[kind] || palette.text;
        resultWord.style.color = color;
        resultPop.classList.remove("show");
        void resultPop.offsetWidth;
        resultPop.classList.add("show");
      }

      function showSpecial(label) {
        specialBanner.textContent = label;
        specialBanner.classList.remove("show");
        void specialBanner.offsetWidth;
        specialBanner.classList.add("show");
      }

      function bumpScore() {
        scoreEl.classList.remove("bump");
        void scoreEl.offsetWidth;
        scoreEl.classList.add("bump");
      }

      function addRipple(color, strength) {
        state.ripples.push({ age: 0, life: 0.64, color, strength });
      }

      function spawnParticles(kind, amount) {
        const targets = activeTargets();
        const target = targets[0];
        const color = {
          perfect: palette.perfect,
          good: palette.good,
          close: palette.close,
          milestone: palette.accent
        }[kind] || palette.text;

        for (let i = 0; i < amount; i += 1) {
          state.particles.push({
            angle: target.angle + rand(-target.size / 2, target.size / 2),
            radiusOffset: rand(-4, 6),
            drift: rand(-0.9, 0.9),
            speed: rand(26, kind === "perfect" ? 78 : 56),
            size: rand(1.2, kind === "perfect" ? 3.6 : 2.8),
            age: 0,
            life: rand(0.38, 0.78),
            color
          });
        }
      }

      function endRun() {
        state.status = "over";
        state.special = null;
        state.specialUntil = 0;
        resultPop.classList.remove("show");
        specialBanner.classList.remove("show");
        tone("gameover");

        if (state.score > state.bestScore) {
          state.bestScore = state.score;
          localStorage.setItem(STORAGE.bestScore, String(state.bestScore));
        }
        if (state.bestComboRun > state.savedBestCombo) {
          state.savedBestCombo = state.bestComboRun;
          localStorage.setItem(STORAGE.bestCombo, String(state.savedBestCombo));
        }

        finalScore.textContent = state.score;
        finalBest.textContent = state.bestScore;
        finalCombo.textContent = Math.max(state.savedBestCombo, state.bestComboRun);
        finalAccuracy.textContent = formatPercent(state.hits, state.attempts);
        finalPerfects.textContent = state.perfectHits;
        shareStatus.textContent = "";
        gameOverOverlay.classList.add("show");
        updateHud();
      }

      function buildShareText() {
        return [
          `I scored ${state.score} in LOCK IN.`,
          `Best combo: x${state.bestComboRun || 1}`,
          `Accuracy: ${formatPercent(state.hits, state.attempts)}`,
          `Perfect hits: ${state.perfectHits}`
        ].join("\n");
      }

      function drawShareImage(targetCanvas) {
        const imageCtx = targetCanvas.getContext("2d");
        const width = targetCanvas.width;
        const height = targetCanvas.height;
        const centerX = width / 2;

        imageCtx.fillStyle = "#08090b";
        imageCtx.fillRect(0, 0, width, height);

        const bg = imageCtx.createRadialGradient(centerX, height * 0.38, 80, centerX, height * 0.38, 720);
        bg.addColorStop(0, "rgba(216,255,106,0.16)");
        bg.addColorStop(0.48, "rgba(145,231,255,0.055)");
        bg.addColorStop(1, "rgba(8,9,11,0)");
        imageCtx.fillStyle = bg;
        imageCtx.fillRect(0, 0, width, height);

        imageCtx.strokeStyle = "rgba(255,255,255,0.065)";
        imageCtx.lineWidth = 2;
        for (let x = 80; x < width; x += 96) {
          imageCtx.beginPath();
          imageCtx.moveTo(x, 0);
          imageCtx.lineTo(x, height);
          imageCtx.stroke();
        }
        for (let y = 88; y < height; y += 96) {
          imageCtx.beginPath();
          imageCtx.moveTo(0, y);
          imageCtx.lineTo(width, y);
          imageCtx.stroke();
        }

        imageCtx.textAlign = "center";
        imageCtx.fillStyle = "#f4f4f1";
        imageCtx.font = "900 116px Inter, system-ui, sans-serif";
        imageCtx.fillText("LOCK IN", centerX, 250);

        imageCtx.fillStyle = "rgba(244,244,241,0.58)";
        imageCtx.font = "700 30px Inter, system-ui, sans-serif";
        imageCtx.fillText("FINAL SCORE", centerX, 358);

        imageCtx.fillStyle = "#f4f4f1";
        imageCtx.font = "900 220px Inter, system-ui, sans-serif";
        imageCtx.fillText(String(state.score), centerX, 585);

        const best = Math.max(state.bestScore, state.score);
        const stats = [
          ["BEST", best],
          ["BEST COMBO", `x${state.bestComboRun || 1}`],
          ["ACCURACY", formatPercent(state.hits, state.attempts)],
          ["PERFECT HITS", state.perfectHits]
        ];

        const cardW = 410;
        const cardH = 154;
        const gap = 28;
        const startX = centerX - cardW - gap / 2;
        const startY = 720;

        stats.forEach(([label, value], index) => {
          const col = index % 2;
          const row = Math.floor(index / 2);
          const x = startX + col * (cardW + gap);
          const y = startY + row * (cardH + gap);

          imageCtx.fillStyle = "rgba(255,255,255,0.06)";
          imageCtx.strokeStyle = "rgba(255,255,255,0.13)";
          imageCtx.lineWidth = 2;
          roundedRect(imageCtx, x, y, cardW, cardH, 16);
          imageCtx.fill();
          imageCtx.stroke();

          imageCtx.textAlign = "left";
          imageCtx.fillStyle = "rgba(244,244,241,0.58)";
          imageCtx.font = "800 24px Inter, system-ui, sans-serif";
          imageCtx.fillText(label, x + 34, y + 50);

          imageCtx.fillStyle = "#f4f4f1";
          imageCtx.font = "850 54px Inter, system-ui, sans-serif";
          imageCtx.fillText(String(value), x + 34, y + 116);
        });

        imageCtx.textAlign = "center";
        imageCtx.fillStyle = "#d8ff6a";
        imageCtx.font = "800 32px Inter, system-ui, sans-serif";
        imageCtx.fillText("Hit the target at the perfect moment.", centerX, 1306);

        imageCtx.fillStyle = "rgba(244,244,241,0.42)";
        imageCtx.font = "700 24px Inter, system-ui, sans-serif";
        imageCtx.fillText("LOCK IN", centerX, 1368);
      }

      function roundedRect(context, x, y, width, height, radius) {
        context.beginPath();
        context.moveTo(x + radius, y);
        context.arcTo(x + width, y, x + width, y + height, radius);
        context.arcTo(x + width, y + height, x, y + height, radius);
        context.arcTo(x, y + height, x, y, radius);
        context.arcTo(x, y, x + width, y, radius);
        context.closePath();
      }

      function createResultImage() {
        const resultCanvas = document.createElement("canvas");
        resultCanvas.width = 1200;
        resultCanvas.height = 1500;
        drawShareImage(resultCanvas);

        return new Promise(resolve => {
          if (resultCanvas.toBlob) {
            resultCanvas.toBlob(blob => resolve(blob), "image/png", 0.96);
            return;
          }

          try {
            const dataUrl = resultCanvas.toDataURL("image/png");
            const binary = atob(dataUrl.split(",")[1]);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
            resolve(new Blob([bytes], { type: "image/png" }));
          } catch {
            resolve(null);
          }
        });
      }

      async function copyShareText(text) {
        if (window.navigator?.clipboard?.writeText) {
          await window.navigator.clipboard.writeText(text);
          return true;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.left = "-999px";
        document.body.appendChild(textarea);
        textarea.select();
        const copied = document.execCommand && document.execCommand("copy");
        textarea.remove();
        return Boolean(copied);
      }

      function downloadBlob(blob, filename) {
        if (!blob) return false;
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(url), 500);
        return true;
      }

      async function shareRun() {
        if (state.status !== "over") return;

        const text = buildShareText();
        shareButton.disabled = true;
        shareStatus.textContent = "Preparing share...";

        try {
          const image = await createResultImage();
          const files = image && window.File ? [new File([image], "lock-in-result.png", { type: "image/png" })] : [];
          const shareData = { title: "LOCK IN", text };
          if (files.length) shareData.files = files;

          if (window.navigator?.share && (!files.length || !window.navigator.canShare || window.navigator.canShare({ files }))) {
            await window.navigator.share(shareData);
            shareStatus.textContent = "Shared.";
          } else {
            const copied = await copyShareText(text);
            const downloaded = downloadBlob(image, "lock-in-result.png");
            shareStatus.textContent = copied && downloaded
              ? "Copied result and saved screenshot."
              : copied
                ? "Copied result."
                : downloaded
                  ? "Saved screenshot."
                  : "Share is unavailable here.";
          }
        } catch (error) {
          if (error?.name === "AbortError") {
            shareStatus.textContent = "Share cancelled.";
          } else {
            try {
              await copyShareText(text);
              shareStatus.textContent = "Copied result.";
            } catch {
              shareStatus.textContent = "Share is unavailable here.";
            }
          }
        } finally {
          shareButton.disabled = false;
        }
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(rect.width * dpr));
        const height = Math.max(1, Math.round(rect.height * dpr));
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function update(dt, now) {
        if (state.status === "playing") {
          if (state.special && now > state.specialUntil) {
            if (state.special === "reverse") state.direction *= -1;
            state.special = null;
          }

          if (now >= state.freezeUntil) {
            const speedBoost = state.special === "speed" ? 1.46 : 1;
            state.angle = wrapAngle(state.angle + state.direction * state.speed * speedBoost * dt);
          }

          if (state.special === "moving") {
            state.targetAngle = wrapAngle(state.targetAngle + state.direction * 0.36 * dt);
          }
        } else if (state.status === "menu") {
          state.angle = wrapAngle(state.angle + state.direction * 0.72 * dt);
          state.targetAngle = wrapAngle(state.targetAngle + 0.08 * dt);
        }

        state.pulse = Math.max(0, state.pulse - dt * 2.8);
        state.arenaKick = Math.max(0, state.arenaKick - dt * 5.2);
        gameStack.style.setProperty("--arena-scale", String(1 + state.arenaKick * 0.018));

        for (let i = state.particles.length - 1; i >= 0; i -= 1) {
          const p = state.particles[i];
          p.age += dt;
          p.radiusOffset += p.speed * dt;
          p.angle += p.drift * dt;
          if (p.age >= p.life) state.particles.splice(i, 1);
        }

        for (let i = state.ripples.length - 1; i >= 0; i -= 1) {
          const r = state.ripples[i];
          r.age += dt;
          if (r.age >= r.life) state.ripples.splice(i, 1);
        }
      }

      function draw() {
        resizeCanvas();
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const scale = Math.min(w, h) / 980;
        const radius = 352 * scale;
        const line = 16 * scale;

        ctx.clearRect(0, 0, w, h);
        ctx.save();
        ctx.translate(cx, cy);

        const innerGlow = ctx.createRadialGradient(0, 0, radius * 0.34, 0, 0, radius * 1.16);
        innerGlow.addColorStop(0, "rgba(255,255,255,0.026)");
        innerGlow.addColorStop(0.72, "rgba(255,255,255,0.01)");
        innerGlow.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = innerGlow;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 1.18, 0, TAU);
        ctx.fill();

        ctx.lineCap = "round";
        ctx.lineWidth = line;
        ctx.strokeStyle = palette.faint;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, TAU);
        ctx.stroke();

        ctx.lineWidth = 1.2 * scale;
        ctx.strokeStyle = "rgba(255,255,255,0.075)";
        ctx.beginPath();
        ctx.arc(0, 0, radius - 38 * scale, 0, TAU);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, radius + 38 * scale, 0, TAU);
        ctx.stroke();

        for (const ripple of state.ripples) {
          const t = ripple.age / ripple.life;
          ctx.lineWidth = mix(9, 1, t) * scale;
          ctx.strokeStyle = alphaColor(ripple.color, (1 - t) * 0.3 * ripple.strength);
          ctx.beginPath();
          ctx.arc(0, 0, radius + easeOut(t) * 52 * scale, 0, TAU);
          ctx.stroke();
        }

        for (const target of activeTargets()) {
          drawTarget(radius, line, target);
        }

        drawMarker(radius, scale);
        drawParticles(radius, scale);

        ctx.restore();
      }

      function alphaColor(hex, alpha) {
        const clean = hex.replace("#", "");
        const r = parseInt(clean.slice(0, 2), 16);
        const g = parseInt(clean.slice(2, 4), 16);
        const b = parseInt(clean.slice(4, 6), 16);
        return `rgba(${r},${g},${b},${clamp(alpha, 0, 1)})`;
      }

      function drawTarget(radius, line, target) {
        const start = target.angle - target.size / 2;
        const end = target.angle + target.size / 2;
        const pulse = 1 + state.pulse * 0.12;

        ctx.lineCap = "round";
        ctx.lineWidth = line * 1.55 * pulse;
        ctx.strokeStyle = "rgba(216,255,106,0.12)";
        ctx.beginPath();
        ctx.arc(0, 0, radius, start, end);
        ctx.stroke();

        ctx.lineWidth = line * 0.94 * pulse;
        const grad = ctx.createLinearGradient(-radius, -radius, radius, radius);
        grad.addColorStop(0, palette.accent);
        grad.addColorStop(1, palette.blue);
        ctx.strokeStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, radius, start, end);
        ctx.stroke();

        const center = pointOnCircle(target.angle, radius);
        ctx.fillStyle = palette.text;
        ctx.globalAlpha = 0.92;
        ctx.beginPath();
        ctx.arc(center.x, center.y, 4.5 * (line / 16), 0, TAU);
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function drawMarker(radius, scale) {
        const point = pointOnCircle(state.angle, radius);
        const active = state.status === "playing" || state.status === "menu";
        const markerRadius = (active ? 12 : 10) * scale;

        ctx.shadowColor = "rgba(244,244,241,0.44)";
        ctx.shadowBlur = 22 * scale;
        ctx.fillStyle = palette.text;
        ctx.beginPath();
        ctx.arc(point.x, point.y, markerRadius, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = "rgba(8,9,11,0.7)";
        ctx.beginPath();
        ctx.arc(point.x, point.y, markerRadius * 0.32, 0, TAU);
        ctx.fill();
      }

      function drawParticles(radius, scale) {
        for (const p of state.particles) {
          const t = p.age / p.life;
          const point = pointOnCircle(p.angle, radius + p.radiusOffset * scale);
          ctx.globalAlpha = Math.max(0, 1 - t);
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(point.x, point.y, p.size * scale * (1 - t * 0.38), 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function pointOnCircle(angle, radius) {
        return {
          x: Math.cos(angle) * radius,
          y: Math.sin(angle) * radius
        };
      }

      function loop(now) {
        const dt = Math.min(0.033, (now - state.lastTime) / 1000 || 0);
        state.lastTime = now;
        update(dt, now);
        draw();
        requestAnimationFrame(loop);
      }

      function onKeyDown(event) {
        if (event.code !== "Space") return;
        event.preventDefault();
        if (event.repeat) return;
        playerAction("keyboard");
      }

      function onPointerDown(event) {
        event.preventDefault();
        playerAction("pointer");
      }

      startButton.addEventListener("click", () => resetRun());
      againButton.addEventListener("click", () => resetRun());
      shareButton.addEventListener("click", () => shareRun());
      canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
      app.addEventListener("touchmove", event => event.preventDefault(), { passive: false });
      window.addEventListener("keydown", onKeyDown);
      window.addEventListener("resize", resizeCanvas);

      soundToggle.addEventListener("click", () => {
        state.soundOn = !state.soundOn;
        localStorage.setItem(STORAGE.sound, String(state.soundOn));
        setSoundUI();
        if (state.soundOn) {
          ensureAudio();
          tone("good");
        }
      });

      window.__LOCK_IN_TEST__ = {
        evaluateHit,
        setAngles(marker, target, size = state.targetSize) {
          state.angle = marker;
          state.targetAngle = target;
          state.targetSize = size;
          state.special = null;
        },
        getState: () => ({ ...state, particles: state.particles.length, ripples: state.ripples.length }),
        resetRun,
        playerAction,
        endRun,
        buildShareText,
        createResultImage,
        activeTargets,
        angleDistance
      };

      setSoundUI();
      updateHud();
      resizeCanvas();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
