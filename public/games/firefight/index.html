<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="description" content="Fast top-down arena shooter. Solo against bots (works offline) or private 1v1 / 2v2 rooms." />
  <title>Firefight</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <script type="module" crossorigin src="./build/index-Dg8Vjl75.js"></script>
  <link rel="stylesheet" crossorigin href="./build/index-D1_cGoOP.css">
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="world-overlay"></div>
    <div id="hud" hidden></div>
    <div id="screens"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="boot" class="boot">
      <div class="boot-inner">
        <div class="brand"><span class="brand-mark"></span><span class="brand-name">FIREFIGHT</span></div>
        <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
        <div class="boot-row"><div class="boot-status" id="boot-status">Loading</div><div class="boot-pct" id="boot-pct">0%</div></div>
        <div class="boot-tip" id="boot-tip"></div>
      </div>
    </div>
    <noscript><div class="fatal">Firefight needs JavaScript enabled.</div></noscript>
  </div>
</body>
</html>
