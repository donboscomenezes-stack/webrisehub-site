<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>CELL RUSH</title>
    <meta name="description" content="Eat. Grow. Survive. A fast local arcade cell arena with clever AI rivals.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1020'/%3E%3Ccircle cx='32' cy='32' r='20' fill='%235eead4'/%3E%3Ccircle cx='24' cy='23' r='7' fill='%23d7fff8' opacity='.65'/%3E%3Cpath d='M51 30c0 14-10 22-22 22' fill='none' stroke='%23f6c453' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="gameShell" aria-label="CELL RUSH game">
      <canvas id="gameCanvas"></canvas>

      <section id="startScreen" class="screen active" aria-labelledby="title">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1 id="title">CELL RUSH</h1>
        <p class="tagline">Eat. Grow. Survive.</p>
        <label class="name-label" for="playerName">Name</label>
        <input id="playerName" maxlength="10" autocomplete="off" placeholder="YOU" aria-label="Player name">
        <button id="playButton" class="primary">PLAY</button>
        <p class="hint">Mouse, arrow keys, or WASD. Use the thumb stick on mobile.</p>
      </section>

      <section id="gameOverScreen" class="screen" aria-labelledby="gameOverTitle">
        <h2 id="gameOverTitle">GAME OVER</h2>
        <div id="finalScore" class="final-score">0</div>
        <div id="statsGrid" class="stats-grid"></div>
        <button id="againButton" class="primary">PLAY AGAIN</button>
      </section>

      <section id="pauseScreen" class="screen compact" aria-live="polite">
        <h2>PAUSED</h2>
        <p>Tab hidden. You are safe.</p>
      </section>

      <div id="hud" class="hud" aria-live="polite">
        <div class="score-card">
          <div><span>Score</span><strong id="scoreText">0</strong></div>
          <div><span>Mass</span><strong id="massText">0</strong></div>
          <div><span>Rank</span><strong id="rankText">#1</strong></div>
        </div>
        <div class="leaderboard" aria-label="Leaderboard">
          <h2>Top Cells</h2>
          <ol id="leaderboardList"></ol>
          <div id="playerRankOutside" class="outside-rank"></div>
        </div>
      </div>

      <div id="toastLayer" class="toast-layer" aria-live="polite"></div>
      <div id="joystick" class="joystick" aria-label="Movement joystick">
        <div class="joystick-arrows" aria-hidden="true"><span>▲</span><span>◀</span><span>▶</span><span>▼</span></div>
        <div id="joystickThumb" class="joystick-thumb"></div>
      </div>
      <button id="soundButton" class="icon-button" type="button" aria-pressed="true" aria-label="Toggle sound">♪</button>
      <div id="minimap" class="minimap" aria-hidden="true"><canvas id="miniCanvas"></canvas></div>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
