<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline | WebRiseHub</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1120; color: #e6ecf5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 440px; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 28px; margin: 16px 0 8px; }
    p { color: #9fb0c8; line-height: 1.6; margin: 0 0 24px; }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 10px; cursor: pointer; text-decoration: none; }
    button { background: #4b63f0; color: #fff; border: 0; }
    a { color: #e6ecf5; border: 1px solid #2a3654; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.png" alt="WebRiseHub" />
    <h1>Connect to play</h1>
    <p>You're offline and this page hasn't been saved on this device yet. Games and pages you've opened before still work offline.</p>
    <div class="row">
      <button onclick="location.reload()">Try again</button>
      <a href="/">Go to homepage</a>
      <a href="/games/firefight/">Play Firefight</a>
      <a href="/games/webrise-farm/">Play Webrise Farm</a>
    </div>
  </main>
</body>
</html>
